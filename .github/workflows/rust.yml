name: Rust Target

on:
  push:
    branches: [main]
    paths:
      - 'compiler_ports/**'
      - '.github/workflows/rust.yml'
  pull_request:
    branches: [main]
    paths:
      - 'compiler_ports/**'
      - '.github/workflows/rust.yml'
  workflow_dispatch:

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-target:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/local/share/powershell "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Install dependencies
        run: sudo ./install-deps.sh

      - name: Run quick setup (toolchains, runtime, compiler, libc)
        run: ./quick_setup.sh

      - name: Install nightly with rust-src
        run: make rustc

      - name: Run rust target tests
        run: make -C compiler_ports/tests/rust test
